      - "stderr contains a validation error"
      - "tasks.json is not created or changed"
    cross_ref_frs: ["FR-05"]
    cross_ref_nfrs: ["NFR-02"]

  - tc_id: "TC-FR01-03g"
    fr_id: "FR-01"
    ac_id: "AC-1.3"
    test_function: "test_submit_injection_backtick_rejected"
    layer: "unit"
    test_file: "tests/cli/test_submit.py"
    scenario: "Submit a command containing the backtick character."
    asserts:
      - "exit_code == 2"
      - "stderr contains a validation error"
      - "tasks.json is not created or changed"
    cross_ref_frs: ["FR-05"]
    cross_ref_nfrs: ["NFR-02"]

  - tc_id: "TC-FR01-04"
    fr_id: "FR-01"
    ac_id: "AC-1.4"
    test_function: "test_name_uniqueness"
    layer: "unit"
    test_file: "tests/store/test_validation.py"
    scenario: "Submit a name already used by a pending or running task."
    asserts:
      - "each pending/running name collision exits with code 2"
      - "stderr contains a validation error"
      - "the colliding task is not added"
    cross_ref_frs: []
    cross_ref_nfrs: []

  - tc_id: "TC-FR01-05"
    fr_id: "FR-01"
    ac_id: "AC-1.5"
    test_function: "test_atomic_add_task"
    layer: "unit"
    test_file: "tests/store/test_validation.py"
    scenario: "Persist a valid task submission."
    asserts:
      - "id matches exactly eight lowercase hexadecimal characters derived from uuid4"
      - "record contains command, name, created_at, and status == pending"
      - "tasks.json is valid JSON after an atomic write"
    cross_ref_frs: []
    cross_ref_nfrs: ["NFR-03"]

  - tc_id: "TC-FR01-06"
    fr_id: "FR-01"
    ac_id: "AC-1.6"
    test_function: "test_submit_json_output"
    layer: "unit"
    test_file: "tests/cli/test_submit.py"
    scenario: "Submit a valid command with the global JSON-output flag."
    asserts:
      - "exit_code == 0"
      - "stdout is one parseable JSON line"
      - "stdout object contains the generated id and status == pending"
    cross_ref_frs: ["FR-05"]
    cross_ref_nfrs: []

  - tc_id: "TC-FR02-01"
    fr_id: "FR-02"
    ac_id: "AC-2.1"
    test_function: "test_shell_true_grep_zero_matches"
    layer: "unit"
    test_file: "tests/executor/test_run.py"
    scenario: "Execute a task while inspecting the subprocess invocation and production source."
    asserts:
      - "subprocess.run receives shlex.split(command)"
      - "capture_output is true, text is true, and timeout uses TASKQ_TASK_TIMEOUT"
      - "production code contains zero shell=True call sites"
    cross_ref_frs: []
    cross_ref_nfrs: ["NFR-02"]

  - tc_id: "TC-FR02-02"
    fr_id: "FR-02"
    ac_id: "AC-2.2"
    test_function: "test_state_transitions"
    layer: "unit"
    test_file: "tests/executor/test_run.py"
    scenario: "Execute success, non-zero, and timeout outcomes from pending tasks."
    asserts:
      - "pending transitions through running"
      - "exit code 0 produces done"
      - "non-zero exit produces failed and TimeoutExpired produces timeout"
    cross_ref_frs: []
    cross_ref_nfrs: []

  - tc_id: "TC-FR02-03"
    fr_id: "FR-02"
    ac_id: "AC-2.3"
    test_function: "test_result_record_fields"
    layer: "unit"
    test_file: "tests/executor/test_run.py"
    scenario: "Persist the result of a completed task."
    asserts:
      - "result contains exit_code, duration_ms, and finished_at"
      - "stdout_tail contains at most the final 2000 characters"
      - "stderr_tail contains at most the final 2000 characters"
    cross_ref_frs: []
    cross_ref_nfrs: ["NFR-04"]

  - tc_id: "TC-FR02-04"
    fr_id: "FR-02"
    ac_id: "AC-2.4"
    test_function: "test_run_all_concurrent"
    layer: "integration"
    test_file: "tests/integration/test_run_all.py"
    scenario: "Run all pending tasks with configured concurrency."
    asserts:
      - "ThreadPoolExecutor is constructed with TASKQ_MAX_WORKERS"
      - "all pending tasks are submitted for execution"
      - "shared store writes remain valid under threading.Lock"
    cross_ref_frs: ["FR-05"]
    cross_ref_nfrs: ["NFR-09"]

  - tc_id: "TC-FR02-05"
    fr_id: "FR-02"
    ac_id: "AC-2.5"
    test_function: "test_timeout_exit_code_4"
    layer: "unit"
    test_file: "tests/executor/test_run.py"
    scenario: "Run one task that exceeds TASKQ_TASK_TIMEOUT."
    asserts:
      - "task status == timeout"
      - "single-task command exit_code == 4"
    cross_ref_frs: ["FR-05"]
    cross_ref_nfrs: []

  - tc_id: "TC-FR03-01"
    fr_id: "FR-03"
    ac_id: "AC-3.1"
    test_function: "test_retry_exponential_backoff"
    layer: "integration"
    test_file: "tests/integration/test_retry.py"
    scenario: "Run failed and timed-out tasks through the retry limit with injected sleep."
    asserts:
      - "at most TASKQ_RETRY_LIMIT retries follow the initial attempt"
      - "retry delays equal TASKQ_BACKOFF_BASE * 2^n"
      - "the injected sleep function receives every expected delay"
    cross_ref_frs: []
    cross_ref_nfrs: []

  - tc_id: "TC-FR03-02"
    fr_id: "FR-03"
    ac_id: "AC-3.2"
    test_function: "test_breaker_open_threshold"
    layer: "unit"
    test_file: "tests/breaker/test_state_machine.py"
    scenario: "Record consecutive final failures up to the configured threshold."
    asserts:
      - "failures below TASKQ_BREAKER_THRESHOLD keep the breaker closed"
      - "the threshold failure transitions the breaker to OPEN"
    cross_ref_frs: []
    cross_ref_nfrs: []

  - tc_id: "TC-FR03-03"
    fr_id: "FR-03"
    ac_id: "AC-3.3"
    test_function: "test_breaker_open_refuses_exit_3"
    layer: "unit"
    test_file: "tests/breaker/test_state_machine.py"
    scenario: "Attempt a run while the global breaker is OPEN."
    asserts:
      - "exit_code == 3"
      - "stderr contains 'breaker open'"
      - "no subprocess is executed"
    cross_ref_frs: ["FR-05"]
    cross_ref_nfrs: []

  - tc_id: "TC-FR03-04"
    fr_id: "FR-03"
    ac_id: "AC-3.4"
    test_function: "test_breaker_half_open_probe"
    layer: "unit"
    test_file: "tests/breaker/test_state_machine.py"
    scenario: "Advance time beyond cooldown and exercise successful and failed probes."
    asserts:
      - "OPEN transitions to HALF_OPEN after TASKQ_BREAKER_COOLDOWN"
      - "exactly one probe is allowed"
      - "success closes and resets the breaker; failure reopens it"
    cross_ref_frs: []
    cross_ref_nfrs: ["NFR-03"]

  - tc_id: "TC-FR03-05"
    fr_id: "FR-03"
    ac_id: "AC-3.5"
    test_function: "test_breaker_state_persistence"
    layer: "integration"
    test_file: "tests/integration/test_retry.py"
    scenario: "Persist and reload breaker state across process-equivalent instances."
    asserts:
      - "breaker.json records the current breaker state and counters"
      - "a new instance reloads the persisted state"
      - "breaker.json remains valid after atomic replacement"
    cross_ref_frs: []
    cross_ref_nfrs: ["NFR-03"]

  - tc_id: "TC-FR04-01"
    fr_id: "FR-04"
    ac_id: "AC-4.1"
    test_function: "test_signature_sha256"
    layer: "unit"
    test_file: "tests/cache/test_ttl.py"
    scenario: "Compute a cache signature for a known command."
    asserts:
      - "signature equals sha256(command)"
      - "the complete command string determines the digest"
    cross_ref_frs: []
    cross_ref_nfrs: []

  - tc_id: "TC-FR04-02"
    fr_id: "FR-04"
    ac_id: "AC-4.2"
    test_function: "test_cached_replay_within_ttl"
    layer: "integration"
    test_file: "tests/integration/test_cached_run.py"
    scenario: "Run a same-signature task with --cached before TTL expiry."
    asserts:
      - "cached exit_code and stdout_tail are replayed"
      - "no subprocess is spawned"
      - "task status == done and cached == true"
    cross_ref_frs: ["FR-05"]
    cross_ref_nfrs: []

  - tc_id: "TC-FR04-03"
    fr_id: "FR-04"
    ac_id: "AC-4.3"
    test_function: "test_cache_miss_normal_execution"
    layer: "integration"
    test_file: "tests/integration/test_cached_run.py"
    scenario: "Run with a missing or expired cache entry."
    asserts:
      - "the task executes normally"
      - "a successful done result is written to cache.json"
      - "an expired result is not replayed"
    cross_ref_frs: ["FR-05"]
    cross_ref_nfrs: []

  - tc_id: "TC-FR04-04"
    fr_id: "FR-04"
    ac_id: "AC-4.4"
    test_function: "test_cache_concurrent_writes"
    layer: "unit"
    test_file: "tests/cache/test_ttl.py"
    scenario: "Perform concurrent cache reads and writes."
    asserts:
      - "cache access is guarded for thread safety"
      - "cache.json remains parseable after concurrent writes"
      - "writes use atomic replacement"
    cross_ref_frs: ["FR-02"]
    cross_ref_nfrs: ["NFR-03"]

  - tc_id: "TC-FR05-01"
    fr_id: "FR-05"
    ac_id: "AC-5.1"
    test_function: "test_subcommands_wired"
    layer: "unit"
    test_file: "tests/cli/test_argparse.py"
    scenario: "Build the parser and inspect each documented subcommand."
    asserts:
      - "submit, run, status, list, and clear parse successfully"
      - "each subcommand dispatches to its documented handler"
    cross_ref_frs: ["FR-01", "FR-02", "FR-04"]
    cross_ref_nfrs: []

  - tc_id: "TC-FR05-02"
    fr_id: "FR-05"
    ac_id: "AC-5.2"
    test_function: "test_run_args"
    layer: "unit"
    test_file: "tests/cli/test_argparse.py"
    scenario: "Parse run with an id, --cached, and --all combinations."
    asserts:
      - "run accepts a positional task id"
      - "run accepts --cached for a single id"
      - "run accepts the documented --all form"
    cross_ref_frs: ["FR-02", "FR-04"]
    cross_ref_nfrs: []

  - tc_id: "TC-FR05-03"
    fr_id: "FR-05"
    ac_id: "AC-5.3"
    test_function: "test_global_json_flag"
    layer: "unit"
    test_file: "tests/cli/test_argparse.py"
    scenario: "Invoke supported commands with the global --json flag."
    asserts:
      - "output is one parseable JSON line"
      - "no human-readable text contaminates JSON output"
    cross_ref_frs: ["FR-01"]
    cross_ref_nfrs: []

  - tc_id: "TC-FR05-04"
    fr_id: "FR-05"
    ac_id: "AC-5.4"
    test_function: "test_exit_code_map"
    layer: "integration"
    test_file: "tests/integration/test_cli_exit_codes.py"
    scenario: "Exercise success, validation, breaker-open, timeout, and internal-error outcomes."
    asserts:
      - "success exits 0"
      - "input validation exits 2, breaker open exits 3, and single-task timeout exits 4"
      - "other internal errors exit 1"
    cross_ref_frs: ["FR-01", "FR-02", "FR-03"]
    cross_ref_nfrs: []

  - tc_id: "TC-FR05-05"
    fr_id: "FR-05"
    ac_id: "AC-5.5"
    test_function: "test_status_list_clear"
    layer: "unit"
    test_file: "tests/cli/test_argparse.py"
    scenario: "Use status, filtered list, and clear against populated task storage."
    asserts:
      - "status outputs the full selected task record"
      - "list returns all tasks or only the requested status"
      - "clear empties TASKQ_HOME"
    cross_ref_frs: []
    cross_ref_nfrs: []

  - tc_id: "TC-FR05-06"
    fr_id: "FR-05"
    ac_id: "AC-5.6"
    test_function: "test_unknown_task_exit_2"
    layer: "integration"
    test_file: "tests/integration/test_cli_exit_codes.py"
    scenario: "Use status, run, and clear with an unknown task id."
    asserts:
      - "each command exits 2"
      - "stderr contains the verbatim phrase 'unknown task: <id>'"
    cross_ref_frs: ["FR-02"]
    cross_ref_nfrs: []

  - tc_id: "TC-FR05-07"
    fr_id: "FR-05"
    ac_id: "AC-5.7"
    test_function: "test_corrupted_store_exit_1"
    layer: "integration"
    test_file: "tests/integration/test_cli_exit_codes.py"
    scenario: "Start taskq with a non-parseable tasks.json file."
    asserts:
      - "exit_code == 1"
      - "stderr contains 'store corrupted'"
      - "the corrupted file is not silently rebuilt"
    cross_ref_frs: []
    cross_ref_nfrs: ["NFR-03", "NFR-07"]

  - tc_id: "TC-FR05-08"
    fr_id: "FR-05"
    ac_id: "AC-5.8"
    test_function: "test_no_bare_except"
    layer: "static"
    test_file: "tests/static/test_no_swallow.py"
    scenario: "Inspect production exception handlers."
    asserts:
      - "production code has no bare except handler"
      - "production code does not swallow unexpected Exception values"
      - "unexpected exceptions reach the canonical exit-1 boundary"
    cross_ref_frs: []
    cross_ref_nfrs: ["NFR-07"]

