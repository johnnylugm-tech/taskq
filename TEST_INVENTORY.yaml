# TEST_INVENTORY.yaml — P1 Naming Authority
# Authoritative pytest names derived from the approved SRS and traceability matrix.
# Counted coverage is the independent entries under `tests`; cross-cutting names are
# downstream NFR naming guidance and do not duplicate the counted FR contracts.
format_version: "2.0"

test_inventory:
  project: "taskq"
  phase: 1
  language: "python"
  framework: "pytest"
  sources:
    srs: "01-requirements/SRS.md"
    traceability_matrix: "01-requirements/TRACEABILITY_MATRIX.md"
    matrix_test_trace: "TRACEABILITY_MATRIX.md §4"
  naming_convention:
    pattern: "^test_[a-z0-9_]+$"
    tc_id_pattern: "^TC-FR[0-9]{2}-[0-9]{2}[a-z]?$"
  matrix_alignment:
    fr_acceptance_criteria_rows: 28
    expanded_test_contracts: 34
    expansion:
      source: "AC-1.3 / injection-character row marked x7 in TRACEABILITY_MATRIX.md §4"
      tc_ids:
        - "TC-FR01-03a"
        - "TC-FR01-03b"
        - "TC-FR01-03c"
        - "TC-FR01-03d"
        - "TC-FR01-03e"
        - "TC-FR01-03f"
        - "TC-FR01-03g"

tests:
  - tc_id: "TC-FR01-01"
    fr_id: "FR-01"
    ac_id: "AC-1.1"
    test_function: "test_submit_empty_command_exits_2"
    layer: "unit"
    test_file: "tests/cli/test_submit.py"
    scenario: "Submit a command that is empty after whitespace stripping."
    asserts:
      - "exit_code == 2"
      - "stderr contains a validation error"
      - "tasks.json is not created or changed"
    cross_ref_frs: ["FR-05"]
    cross_ref_nfrs: []

  - tc_id: "TC-FR01-02"
    fr_id: "FR-01"
    ac_id: "AC-1.2"
    test_function: "test_submit_long_command_exits_2"
    layer: "unit"
    test_file: "tests/cli/test_submit.py"
    scenario: "Submit a command containing 1001 characters."
    asserts:
      - "exit_code == 2"
      - "stderr contains a validation error"
      - "tasks.json is not created or changed"
    cross_ref_frs: ["FR-05"]
    cross_ref_nfrs: []

  - tc_id: "TC-FR01-03a"
