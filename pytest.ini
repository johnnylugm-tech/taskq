[pytest]
# Project-level pytest config.
#
# The taskq project's TDD suite lives under 03-development/tests/. The
# `harness/` submodule ships its own self-tests (e.g. workflowgen golden
# pinning) which are not part of the project's TDD evidence; one of them
# has a known deferred disposition (see 04-testing/TEST_RESULTS.md — the
# harness golden fixture drift, intentionally not regenerated in this
# deliverable because regenerating it would modify `harness/`).
#
# Scoping test discovery to 03-development/tests keeps the advance-phase
# `pytest --cov=03-development/src --cov-fail-under=100` check focused on
# project evidence, while leaving the harness self-tests runnable in their
# own directory (`cd harness && pytest`).
testpaths = 03-development/tests
addopts = -v --tb=short